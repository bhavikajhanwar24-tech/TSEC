<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RepoGuardian</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛡️</text></svg>" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="topbar">
    <h1>RepoGuardian</h1>
    <div id="user-area"></div>
  </header>

  <main>
    <section id="login-view" class="hidden">
      <div class="card login-card">
        <h2>Sign in to see your repositories</h2>
        <p>Connect your GitHub account to browse your repos and their file structure.</p>
        <a class="btn github-btn" id="login-btn" href="/auth/github">Login with GitHub</a>
      </div>
    </section>

    <section id="app-view" class="hidden">
      <div id="repo-list"></div>
    </section>
  </main>

  <script src="/config.js"></script>
  <script src="/app.js"></script>
</body>
</html>
